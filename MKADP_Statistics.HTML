<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mogi Track - コース詳細分析 & ランキングダッシュボード</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* 検索フィルターエリア */
    .filter-card {
      background: white; border-radius: 12px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;
    }
    .match-mode-selector {
      display: flex; align-items: center; gap: 20px; background: #f0f4f9;
      padding: 10px 16px; border-radius: 8px; margin-bottom: 15px; font-size: 14px;
    }
    .match-mode-selector label { cursor: pointer; font-weight: bold; color: #333; }

    .filter-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;
    }
    .filter-group { display: flex; flex-direction: column; }
    .filter-group label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
    .filter-group select, .filter-group input {
      padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    .filter-actions { margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #0066ff; color: white; }
    .btn-secondary { background: #e0e0e0; color: #333; }

    /* サマリーカードエリア */
    .stats-summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px;
    }
    .stat-box {
      background: white; border-radius: 12px; padding: 20px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .stat-box .number { font-size: 26px; font-weight: bold; color: #0066ff; margin-top: 5px; }

    /* 結果テーブル */
    .table-container { background: white; border-radius: 12px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th, .data-table td { padding: 12px 14px; border-bottom: 1px solid #eee; font-size: 14px; white-space: nowrap; }
    .data-table th { background: #f8f9fa; color: #444; font-size: 13px; }
    .rank-badge { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; font-weight: bold; font-size: 12px; }
    .rank-1 { background: #ffd700; color: #333; }
    .rank-2 { background: #c0c0c0; color: #333; }
    .rank-3 { background: #e59866; color: white; }

    /* ラウンジ Tier別統計スタイル */
    .lounge-tier-section {
      background: white; border-radius: 12px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .lounge-tier-section.hidden {
      display: none !important;
    }

    .tier-header h2 { margin-top: 0; font-size: 1.2rem; color: #333; }
    .tier-tab-list {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; border-bottom: 2px solid #eef2f7; padding-bottom: 10px;
    }
    .tier-tab-btn {
      background: #f0f4f9; color: #555; border: 1px solid #dce4ec; padding: 6px 14px;
      border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s ease; font-size: 13px;
    }
    .tier-tab-btn:hover { background: #e2eaf4; color: #111; }
    .tier-tab-btn.active {
      background: #0066ff; color: #fff; border-color: #0055cc;
      box-shadow: 0 2px 6px rgba(0, 102, 255, 0.3);
    }
    .tier-content-panel { display: none; }
    .tier-content-panel.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

    .tier-summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px;
    }
    .stat-card {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .stat-card.highlight { background: #eff6ff; border-color: #bfdbfe; }
    .stat-label { font-size: 0.8rem; color: #64748b; margin-bottom: 4px; }
    .stat-value { font-size: 1.4rem; font-weight: bold; color: #1e293b; }
    .stat-value small { font-size: 0.85rem; font-weight: normal; color: #64748b; }
    .stat-sub { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

    .tier-course-section h3 { font-size: 1rem; margin-bottom: 10px; color: #334155; }
    .table-responsive { overflow-x: auto; }
    .tier-course-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; }
    .tier-course-table th, .tier-course-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
    .tier-course-table th { background: #f1f5f9; color: #475569; font-weight: 600; }
    .tier-course-table td.course-name { font-weight: 600; color: #0f172a; }

</head>

/**
 * AES-GCM 復号 ＆ 自動解凍 (Gzip / 通常 両対応)
 */
async function decryptData(encryptedBase64, secretKeyStr) {
  const dec = new TextDecoder();
  const enc = new TextEncoder();

  const keyMaterial = await crypto.subtle.digest('SHA-256', enc.encode(secretKeyStr));
  const key = await crypto.subtle.importKey(
    'raw',
    keyMaterial,
    { name: 'AES-GCM' },
    false,
    ['decrypt']
  );

  const cleanBase64 = encryptedBase64.replace(/\s/g, '');
  const binaryString = atob(cleanBase64);
  const bytes = new Uint8Array(binaryString.length);
  for (let i = 0; i < binaryString.length; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }

  if (bytes.length < 12) {
    throw new Error("暗号化データサイズが短すぎます");
  }

  const iv = bytes.subarray(0, 12);
  const data = bytes.subarray(12);

  let decryptedBuffer;
  try {
    decryptedBuffer = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      data
    );
  } catch (err) {
    console.error("🔑 復号失敗: 鍵は合っていますが、データ形式が合っていないか壊れている可能性があります。");
    throw err;
  }

  const decryptedBytes = new Uint8Array(decryptedBuffer);

  if (decryptedBytes.length >= 2 && decryptedBytes[0] === 0x1f && decryptedBytes[1] === 0x8b) {
    const decompressedStream = new Blob([decryptedBuffer])
      .stream()
      .pipeThrough(new DecompressionStream('gzip'));
    const decompressedBuffer = await new Response(decompressedStream).arrayBuffer();
    return JSON.parse(dec.decode(decompressedBuffer));
  }

  return JSON.parse(dec.decode(decryptedBuffer));
}

/**
 * 順位から点数を計算
 */
function getScoreFromRank(gameType, rank) {
  const gameKey = gameType && SCORE_TABLES[gameType] ? gameType : 'MKWORLD';
  const table = SCORE_TABLES[gameKey];
  return table[rank] !== undefined ? table[rank] : 0;
}

async function fetchSingleGameData(targetGameType) {
  const fileName = `${targetGameType.toLowerCase()}_records.json`;
  const fileUrl = `${GITHUB_BASE_URL}${fileName}`;

  try {
    const res = await fetch(fileUrl, { cache: 'no-cache' });
    if (!res.ok) {
      console.warn(`ゲーム [${targetGameType}] のデータファイル (${fileName}) が存在しません。`);
      return [];
    }

    const payload = await res.json();
    if (!payload || !payload.data) {
      console.warn(`ゲーム [${targetGameType}] のデータ形式が不正です。`);
      return [];
    }

    const decrypted = await decryptData(payload.data, SYSTEM_ENCRYPTION_KEY);
    const records = decrypted.map(item => ({ ...item, game_type: item.game_type || targetGameType }));

    console.log("🟢 復号されたデータ構造:", records);

    return records;
  } catch (err) {
    console.error(`❌ [${targetGameType}] の復号エラー:`, err);
    return [];
  }
}

async function loadAndDecryptGameData(targetGameType) {
  const tbody = document.getElementById('course-stats-tbody');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">データを取得・復号中...</td></tr>';

  if (targetGameType === 'ALL') {

    ]);

  renderStats();
}

// ==========================================
// 3. AND / OR 条件評価関数
// ==========================================
function evaluateRaceRecord(item, race, filters) {
  const matchResults = [];
  const recGame = item.game_type || 'MKWORLD';
  const raw = item.rawRecord || item;

  // --- レコードレベルの条件評価 ---
  if (filters.game !== 'ALL') {
    matchResults.push(recGame === filters.game);
  }
  if (filters.mode !== 'ALL') {
    matchResults.push(raw.mode === filters.mode);
  }
  if (filters.season !== 'ALL') {
    // S1 / 1 の両記法表記揺れ対策
    const rawSeason = String(raw.season || '').toUpperCase();
    const filterSeason = String(filters.season).toUpperCase();
    const cleanRawSeason = rawSeason.startsWith('S') ? rawSeason : `S${rawSeason}`;
    const cleanFilterSeason = filterSeason.startsWith('S') ? filterSeason : `S${filterSeason}`;
    matchResults.push(cleanRawSeason === cleanFilterSeason);
  }

  // Tier フィルタ評価
  if (filters.tier && filters.tier !== 'ALL') {
    const recordTier = String(race.tier || raw.tier || raw.tier_name || '').toUpperCase();
    matchResults.push(recordTier === filters.tier.toUpperCase());
  }

  const recDate = new Date(raw.timestamp || raw.timestamp_iso || raw.created_at);
  if (filters.startDate) {
    matchResults.push(recDate >= new Date(filters.startDate + 'T00:00:00'));
  }
  if (filters.endDate) {
    matchResults.push(recDate <= new Date(filters.endDate + 'T23:59:59'));
  }

  let isRecordMatched = true;
  if (matchResults.length > 0) {
    isRecordMatched = filters.matchMode === 'AND'
      ? matchResults.every(res => res === true)
      : matchResults.some(res => res === true);
  }

  if (!isRecordMatched) return false;

  // --- レースレベルの条件評価（コース指定） ---
  if (filters.selectedCourse && filters.selectedCourse !== 'ALL') {
    const courseName = (race && race.course) ? race.course : (raw.course_name || raw.course || '');
    if (!courseName.toLowerCase().includes(filters.selectedCourse.toLowerCase())) {
      return false;
    }
  }

  return true;
}

// ==========================================
// 4. 統計・ランキング集計コアロジック
// ==========================================
function computeDetailedCourseStats(records, filters) {
  let totalRaceCount = 0;
  let totalScoreSum = 0;
  let totalRankSum = 0;

  const courseMap = {};

  records.forEach(item => {
    const recGame = item.game_type || 'MKWORLD';
    const raw = item.rawRecord || item;

    let raceList = [];
    if (Array.isArray(item.statsRecords) && item.statsRecords.length > 0) {
      raceList = item.statsRecords;
    } else if (Array.isArray(raw.statsRecords) && raw.statsRecords.length > 0) {
      raceList = raw.statsRecords;
    } else if (Array.isArray(raw.races) && raw.races.length > 0) {
      raceList = raw.races;
    } else {
      raceList = [{
        course: raw.course || raw.course_name,
        rank: raw.rank,
        score: raw.score
      }];
    }

    raceList.forEach(race => {
      if (!evaluateRaceRecord(item, race, filters)) return;

      const courseName = race.course || race.course_name || raw.course || raw.course_name || '不明なコース';
      const rank = Number(race.rank);
      
      const validRank = (!isNaN(rank) && rank > 0) ? rank : 0;
      const score = (race.score !== undefined && race.score !== null)
        ? Number(race.score)
        : (validRank > 0 ? getScoreFromRank(recGame, validRank) : 0);

      totalRaceCount++;
      totalRankSum += validRank;
      totalScoreSum += score;

      if (!courseMap[courseName]) {
        courseMap[courseName] = {
          count: 0,
          rankSum: 0,
          scoreSum: 0,
          gameType: recGame
        };
      }

      courseMap[courseName].count++;
      courseMap[courseName].rankSum += validRank;
      courseMap[courseName].scoreSum += score;
    });
  });

  const courseList = Object.keys(courseMap).map(name => {
    const c = courseMap[name];
    const raceInterval = c.count > 0 ? (totalRaceCount / c.count).toFixed(1) : '-';

    return {
      name,
      gameType: c.gameType,
      count: c.count,
      pickRate: totalRaceCount > 0 ? ((c.count / totalRaceCount) * 100).toFixed(1) : '0.0',
      raceInterval: `${raceInterval} レースに1回`,
      avgRank: c.count > 0 ? (c.rankSum / c.count).toFixed(2) : '-',
      avgScore: c.count > 0 ? (c.scoreSum / c.count).toFixed(1) : '-'
    };
  });

  courseList.sort((a, b) => b.count - a.count);

  courseList.forEach((item, index) => {
    item.rankPosition = index + 1;
  });

  return {
    totalRaceCount,
    uniqueCourses: courseList.length,
    overallAvgRank: totalRaceCount > 0 ? (totalRankSum / totalRaceCount).toFixed(2) : '-',
    overallAvgScore: totalRaceCount > 0 ? (totalScoreSum / totalRaceCount).toFixed(1) : '-',
    courseList
  };
}

// ==========================================
// 5. ラウンジ Tier別 (全15種 + ALL) 統計集計モジュール
// ==========================================

const LOUNGE_TIERS_ORDER = [
  "SQ", "X", "S", "A", "B", "BC", "C", "CD", 
  "D", "DE", "E", "EF", "F", "FG", "G"
];

function aggregateLoungeStatsByTier(rawRecords, filterTier = 'ALL') {
  if (!Array.isArray(rawRecords)) return {};

  const createInitialTierObj = (name) => ({
    tier: name,
    totalMogiCount: new Set(),
    totalRaces: 0,
    totalRankSum: 0,
    totalScoreSum: 0,
    wins: 0,
    podiums: 0,
    courseStats: {}
  });

  const tierStats = {
    ALL: createInitialTierObj("ALL")
  };
  LOUNGE_TIERS_ORDER.forEach(t => {
    tierStats[t] = createInitialTierObj(t);
  });

  rawRecords.forEach(data => {
    const record = data.rawRecord || data;

    const mode = (record.mode || '').toLowerCase();
    if (mode !== 'lounge') return;

    const recordTier = record.tier || record.tier_name || 'Unknown';
    const races = Array.isArray(record.races) && record.races.length > 0
      ? record.races
      : [{ course: record.course || record.course_name, rank: record.rank, score: record.score, tier: recordTier }];

    races.forEach(race => {
      const rawTierName = String(race.tier || recordTier).toUpperCase();
      const currentTierName = LOUNGE_TIERS_ORDER.includes(rawTierName) ? rawTierName : 'Unknown';

      // フィルターで特定Tierが選択されている場合はそれ以外をスキップ
      if (filterTier !== 'ALL' && currentTierName !== filterTier.toUpperCase()) {
        return;
      }

      if (!tierStats[currentTierName]) {
        tierStats[currentTierName] = createInitialTierObj(currentTierName);
      }

      const rank = Number(race.rank);
      const score = Number(race.score || race.pts || 0);
      const course = race.course || race.course_name || record.course || record.course_name || '不明なコース';

      if (isNaN(rank) || rank <= 0) return;

      const mogiId = record.timestamp || record.id || `${record.date || ''}_${record.mode || ''}_${record.season || ''}`;

      const targets = [tierStats[currentTierName], tierStats.ALL];

      targets.forEach(target => {
        target.totalMogiCount.add(mogiId);
        target.totalRaces += 1;
        target.totalRankSum += rank;
        target.totalScoreSum += score;

        if (rank === 1) target.wins += 1;
        if (rank <= 3) target.podiums += 1;

        if (!target.courseStats[course]) {
          target.courseStats[course] = {
            courseName: course,
            count: 0,
            rankSum: 0,
            scoreSum: 0
          };
        }
        target.courseStats[course].count += 1;
        target.courseStats[course].rankSum += rank;
        target.courseStats[course].scoreSum += score;
      });
    });
  });

  const result = {};
  const sortedKeys = [
    ...LOUNGE_TIERS_ORDER,
    ...Object.keys(tierStats).filter(k => !LOUNGE_TIERS_ORDER.includes(k) && k !== 'ALL'),
    'ALL'
  ];

  sortedKeys.forEach(tierName => {
    const stats = tierStats[tierName];
    if (!stats || stats.totalRaces === 0) return;

    const totalRaces = stats.totalRaces;

    const formattedCourses = Object.values(stats.courseStats).map(c => ({
      courseName: c.courseName,
      count: c.count,
      avgRank: (c.rankSum / c.count).toFixed(2),
      avgScore: (c.scoreSum / c.count).toFixed(1)
    })).sort((a, b) => parseFloat(a.avgRank) - parseFloat(b.avgRank));

    result[tierName] = {
      tier: tierName,
      totalMogiCount: stats.totalMogiCount.size,
      totalRaces: totalRaces,
      avgRank: (stats.totalRankSum / totalRaces).toFixed(2),
      avgScore: (stats.totalScoreSum / totalRaces).toFixed(1),
      winRate: ((stats.wins / totalRaces) * 100).toFixed(1) + '%',
      podiumRate: ((stats.podiums / totalRaces) * 100).toFixed(1) + '%',
      courses: formattedCourses
    };
  });

  return result;
}

        </div>
      </div>

      <div class="tier-course-section">
        <h3>${tierName} コース別パフォーマンス</h3>
        <div class="table-responsive">
          <table class="tier-course-table">
            <thead>
              <tr>
                <th>コース名</th>
                <th>走破数</th>
                <th>平均順位</th>
                <th>平均スコア</th>
              </tr>
            </thead>
            <tbody>
              ${data.courses.length > 0 ? data.courses.map(c => `
                <tr>
                  <td class="course-name">${c.courseName}</td>
                  <td>${c.count}</td>
                  <td><strong>${c.avgRank}</strong> 位</td>
                  <td>${c.avgScore} pts</td>
                </tr>
              `).join('') : '<tr><td colspan="4">コースデータがありません</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;

    contentWrapper.appendChild(panel);
  });

  container.appendChild(contentWrapper);
}

function renderStats() {
  const matchMode = document.querySelector('input[name="match-mode"]:checked').value;
  const selectedCourse = document.getElementById('filter-course').value;
  const selectedMode = document.getElementById('filter-mode').value;
  const selectedTier = document.getElementById('filter-tier').value;

  const filters = {
    matchMode,
    game: document.getElementById('filter-game').value,
    mode: selectedMode,
    tier: selectedTier,
    season: document.getElementById('filter-season').value,
    startDate: document.getElementById('filter-start-date').value,
    endDate: document.getElementById('filter-end-date').value,
    selectedCourse
  };

  // 1. コース詳細＆ランキング計算
  const result = computeDetailedCourseStats(activeRecordsCache, filters);

  // サマリー表示の更新
  document.getElementById('stat-total-races').textContent = result.totalRaceCount.toLocaleString();
  document.getElementById('stat-unique-courses').textContent = result.uniqueCourses;
  document.getElementById('stat-avg-rank').textContent = result.overallAvgRank;
  document.getElementById('stat-avg-score').textContent = result.overallAvgScore;

  // メインコーステーブルの更新
  const tbody = document.getElementById('course-stats-tbody');
  tbody.innerHTML = '';

  if (result.courseList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">該当するデータが存在しません</td></tr>';
  } else {
    result.courseList.forEach(c => {
      let rankBadge = c.rankPosition;
      if (c.rankPosition === 1) rankBadge = `<span class="rank-badge rank-1">1</span>`;
      else if (c.rankPosition === 2) rankBadge = `<span class="rank-badge rank-2">2</span>`;
      else if (c.rankPosition === 3) rankBadge = `<span class="rank-badge rank-3">3</span>`;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${rankBadge}</td>
        <td><strong>${c.name}</strong></td>
        <td>${c.count} 回</td>
        <td>${c.pickRate} %</td>
        <td>${c.raceInterval}</td>
        <td>${c.avgRank} 位</td>
        <td>${c.avgScore} 点</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 2. ラウンジ Tier別 UI の表示制御 ＆ 描画
  const tierSection = document.getElementById('lounge-tier-section');

  // モードが 'lounge' または 'ALL' の時に Tier別エリアを表示
  if (selectedMode === 'lounge' || selectedMode === 'ALL') {
    tierSection.classList.remove('hidden');
    const tierStatsMap = aggregateLoungeStatsByTier(activeRecordsCache, selectedTier);
    renderLoungeTierStatsUI(tierStatsMap);
  } else {
    // 'nora' や 'tournament' の時は折りたたんで非表示化
    tierSection.classList.add('hidden');
  }
}

// ==========================================
// 7. イベントリスナー & 初期化
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  initializeData();

  document.getElementById('filter-game').addEventListener('change', (e) => {
    const selectedGame = e.target.value;
    updateCourseDropdown(selectedGame);
    loadAndDecryptGameData(selectedGame);
  });

  document.getElementById('btn-apply').addEventListener('click', renderStats);

  document.getElementById('btn-reset').addEventListener('click', () => {
    document.querySelector('input[name="match-mode"][value="AND"]').checked = true;
    document.getElementById('filter-game').value = 'MKWORLD';
    document.getElementById('filter-mode').value = 'ALL';
    document.getElementById('filter-tier').value = 'ALL';
    document.getElementById('filter-season').value = 'ALL';
    document.getElementById('filter-start-date').value = '';
    document.getElementById('filter-end-date').value = '';

    updateCourseDropdown('MKWORLD');
    loadAndDecryptGameData('MKWORLD');
  });
});
</script>
</body>
</html>
