<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mogi Track - コース詳細分析 & ランキングダッシュボード</title>
  <style>
    body { font-family: sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* 検索フィルターエリア */
    .filter-card {
      background: white; border-radius: 12px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;
    }
    .match-mode-selector {
      display: flex; align-items: center; gap: 20px; background: #f0f4f9;
      padding: 10px 16px; border-radius: 8px; margin-bottom: 15px; font-size: 14px;
    }
    .match-mode-selector label { cursor: pointer; font-weight: bold; color: #333; }

    .filter-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;
    }
    .filter-group { display: flex; flex-direction: column; }
    .filter-group label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
    .filter-group select, .filter-group input {
      padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    .filter-actions { margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #0066ff; color: white; }
    .btn-secondary { background: #e0e0e0; color: #333; }

    /* サマリーカードエリア */
    .stats-summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px;
    }
    .stat-box {
      background: white; border-radius: 12px; padding: 20px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .stat-box .number { font-size: 26px; font-weight: bold; color: #0066ff; margin-top: 5px; }

    /* 結果テーブル */
    .table-container { background: white; border-radius: 12px; overflow-x: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th, .data-table td { padding: 12px 14px; border-bottom: 1px solid #eee; font-size: 14px; white-space: nowrap; }
    .data-table th { background: #f8f9fa; color: #444; font-size: 13px; }
    .rank-badge { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; font-weight: bold; font-size: 12px; }
    .rank-1 { background: #ffd700; color: #333; }
    .rank-2 { background: #c0c0c0; color: #333; }
    .rank-3 { background: #e59866; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h2>🏎️ コースデータ・ランキング詳細分析</h2>

  <!-- 絞り込み条件フォーム -->
  <div class="filter-card">
    <div class="match-mode-selector">
      <span><strong>条件指定モード:</strong></span>
      <label><input type="radio" name="match-mode" value="AND" checked> すべての条件に一致 (AND)</label>
      <label><input type="radio" name="match-mode" value="OR"> いずれかの条件に一致 (OR)</label>
    </div>

    <div class="filter-grid">
      <div class="filter-group">
        <label for="filter-game">ゲームタイトル</label>
        <select id="filter-game">
          <option value="ALL">すべて (指定なし)</option>
          <option value="MKWORLD">MKWORLD</option>
          <option value="MK8DX" selected>MK8DX</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filter-mode">モード</label>
        <select id="filter-mode">
          <option value="ALL">すべて (指定なし)</option>
          <option value="lounge">ラウンジ (Lounge)</option>
          <option value="nora">野良 (Nora)</option>
          <option value="tournament">大会 (Tournament)</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filter-season">シーズン</label>
        <select id="filter-season">
          <option value="ALL">すべて (指定なし)</option>
          <option value="1">Season 1</option>
          <option value="2">Season 2</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filter-start-date">開始日</label>
        <input type="date" id="filter-start-date">
      </div>

      <div class="filter-group">
        <label for="filter-end-date">終了日</label>
        <input type="date" id="filter-end-date">
      </div>

      <div class="filter-group">
        <label for="filter-course">コース選択</label>
        <select id="filter-course">
          <option value="ALL">すべて (指定なし)</option>
        </select>
      </div>
    </div>

    <div class="filter-actions">
      <button class="btn btn-secondary" id="btn-reset">条件リセット</button>
      <button class="btn btn-primary" id="btn-apply">検索・集計実行</button>
    </div>
  </div>

  <!-- 条件全体のサマリー -->
  <div class="stats-summary">
    <div class="stat-box">
      <div>総集計レース数</div>
      <div class="number" id="stat-total-races">0</div>
    </div>
    <div class="stat-box">
      <div>出現コース種類数</div>
      <div class="number" id="stat-unique-courses">0</div>
    </div>
    <div class="stat-box">
      <div>全体平均順位</div>
      <div class="number" id="stat-avg-rank">-</div>
    </div>
    <div class="stat-box">
      <div>全体平均得点</div>
      <div class="number" id="stat-avg-score">-</div>
    </div>
  </div>

  <!-- コース別集計結果テーブル -->
  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>ピック順位</th>
          <th>コース名</th>
          <th>選ばれた回数 (ピック数)</th>
          <th>選出シェア (ピック率)</th>
          <th>平均出現頻度</th>
          <th>平均順位</th>
          <th>平均得点</th>
        </tr>
      </thead>
      <tbody id="course-stats-tbody">
        <tr><td colspan="7" style="text-align:center;">データを取得中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

/**
 * AES-GCM 復号化関数
 */
/**
 * AES-GCM 復号化 ＆ Gzip解凍関数
 */
/**
 * AES-GCM 復号化 ＆ 自動解凍（Gzip/通常 双方対応版）
 */
/**
 * 【HTML用】安全な AES-GCM 復号 + 自動解凍 (Gzip / 通常 両対応)
 */
async function decryptData(encryptedBase64, secretKeyStr) {
  const dec = new TextDecoder();
  const enc = new TextEncoder();

  // 1. 鍵の生成 (SHA-256)
  const keyMaterial = await crypto.subtle.digest('SHA-256', enc.encode(secretKeyStr));
  const key = await crypto.subtle.importKey(
    'raw',
    keyMaterial,
    { name: 'AES-GCM' },
    false,
    ['decrypt']
  );

  // 2. Base64 デコード (改行や余計な空白を除去して安全に変換)
  const cleanBase64 = encryptedBase64.replace(/\s/g, '');
  const binaryString = atob(cleanBase64);
  const bytes = new Uint8Array(binaryString.length);
  for (let i = 0; i < binaryString.length; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }

  if (bytes.length < 12) {
    throw new Error("暗号化データサイズが短すぎます");
  }

  // 3. IV (先頭12バイト) と 暗号化データ の分離
  const iv = bytes.subarray(0, 12);
  const data = bytes.subarray(12);

  // 4. AES-GCM 復号実行
  let decryptedBuffer;
  try {
    decryptedBuffer = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      data
    );
  } catch (err) {
    console.error("🔑 復号失敗: 鍵は合っていますが、GitHub上のデータが過去の「壊れたデータ」の可能性があります。");
    throw err;
  }

  // 5. Gzip解凍またはテキスト判定
  const decryptedBytes = new Uint8Array(decryptedBuffer);

  // Gzipの判定マジックナンバー (0x1F, 0x8B)
  if (decryptedBytes.length >= 2 && decryptedBytes[0] === 0x1f && decryptedBytes[1] === 0x8b) {
    const decompressedStream = new Blob([decryptedBuffer])
      .stream()
      .pipeThrough(new DecompressionStream('gzip'));
    const decompressedBuffer = await new Response(decompressedStream).arrayBuffer();
    return JSON.parse(dec.decode(decompressedBuffer));
  }

  // 圧縮されていないデータの場合
  return JSON.parse(dec.decode(decryptedBuffer));
}
/**
 * 順位から点数を計算
 */
function getScoreFromRank(gameType, rank) {
  const gameKey = gameType && SCORE_TABLES[gameType] ? gameType : 'MK8DX';
  const table = SCORE_TABLES[gameKey];
  return table[rank] !== undefined ? table[rank] : 0;
}

/**
 * 指定した1つのゲームのデータを取得・復号して返す（補助関数）
 */
async function fetchSingleGameData(targetGameType) {
  const fileName = `${targetGameType.toLowerCase()}_records.json`;
  const fileUrl = `${GITHUB_BASE_URL}${fileName}`;

  try {
    const res = await fetch(fileUrl, { cache: 'no-cache' });
    if (!res.ok) {
      console.warn(`ゲーム [${targetGameType}] のデータファイル (${fileName}) が存在しません。`);
      return [];
    }

    const payload = await res.json();
    if (!payload || !payload.data) {
      console.warn(`ゲーム [${targetGameType}] のデータ形式が不正です。`);
      return [];
    }

    const decrypted = await decryptData(payload.data, SYSTEM_ENCRYPTION_KEY);
    // レコードにゲーム種別を確実に付与
    return decrypted.map(item => ({ ...item, game_type: item.game_type || targetGameType }));
  } catch (err) {
    console.error(`❌ [${targetGameType}] の復号エラー:`, err);
    return [];
  }
}

/**
 * 選択されたゲーム（ALL / MK8DX / MKWORLD）のデータを取得・セットする
 */
async function loadAndDecryptGameData(targetGameType) {
  const tbody = document.getElementById('course-stats-tbody');
  tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">データを取得・復号中...</td></tr>';

  if (targetGameType === 'ALL') {
    // ALLの場合は両方のデータを平行して取得し結合
    const [mk8dxData, mkworldData] = await Promise.all([
      fetchSingleGameData('MK8DX'),
      fetchSingleGameData('MKWORLD')
    ]);
    activeRecordsCache = [...mk8dxData, ...mkworldData];
  } else {
    activeRecordsCache = await fetchSingleGameData(targetGameType);
  }

  console.log(`✅ [${targetGameType}] データを反映完了 (件数: ${activeRecordsCache.length})`);
  renderStats();
}

async function initializeData() {

}

// ==========================================
// 3. AND / OR 条件評価関数
// ==========================================
function evaluateRaceRecord(record, race, filters) {
  const matchResults = [];
  const recGame = record.game_type || 'MK8DX';

  if (filters.game !== 'ALL') {
    matchResults.push(recGame === filters.game);
  }
  if (filters.mode !== 'ALL') {
    matchResults.push(record.mode === filters.mode);
  }
  if (filters.season !== 'ALL') {
    matchResults.push(String(record.season) === String(filters.season));
  }

  const recDate = new Date(record.timestamp || record.timestamp_iso || record.created_at);
  if (filters.startDate) {
    matchResults.push(recDate >= new Date(filters.startDate + 'T00:00:00'));
  }
  if (filters.endDate) {
    matchResults.push(recDate <= new Date(filters.endDate + 'T23:59:59'));
  }

  if (filters.selectedCourse !== 'ALL') {
    const courseName = race.course || '';
    matchResults.push(courseName.toLowerCase().includes(filters.selectedCourse.toLowerCase()));
  }

  if (matchResults.length === 0) return true;

  return filters.matchMode === 'AND'
    ? matchResults.every(res => res === true)
    : matchResults.some(res => res === true);
}

// ==========================================
// 4. 統計・ランキング集計コアロジック
// ==========================================
function computeDetailedCourseStats(records, filters) {
  let totalRaceCount = 0;
  let totalScoreSum = 0;
  let totalRankSum = 0;

  const courseMap = {};

  records.forEach(rec => {
    const recGame = rec.game_type || 'MK8DX';
    const raceList = Array.isArray(rec.races) && rec.races.length > 0 
      ? rec.races 
      : [{ course: rec.course_name || rec.course, rank: rec.rank, score: rec.score }];

    raceList.forEach(race => {
      const rank = Number(race.rank);
      if (isNaN(rank) || rank <= 0) return;

      if (!evaluateRaceRecord(rec, race, filters)) return;

      const courseName = race.course || '不明なコース';
      const score = (race.score !== undefined && race.score !== null)
        ? Number(race.score)
        : getScoreFromRank(recGame, rank);

      totalRaceCount++;
      totalRankSum += rank;
      totalScoreSum += score;

      if (!courseMap[courseName]) {
        courseMap[courseName] = {
          count: 0,
          rankSum: 0,
          scoreSum: 0,
          gameType: recGame
        };
      }

      courseMap[courseName].count++;
      courseMap[courseName].rankSum += rank;
      courseMap[courseName].scoreSum += score;
    });
  });

  const courseList = Object.keys(courseMap).map(name => {
    const c = courseMap[name];
    const raceInterval = c.count > 0 ? (totalRaceCount / c.count).toFixed(1) : '-';

    return {
      name,
      gameType: c.gameType,
      count: c.count,
      pickRate: totalRaceCount > 0 ? ((c.count / totalRaceCount) * 100).toFixed(1) : '0.0',
      raceInterval: `${raceInterval} レースに1回`,
      avgRank: (c.rankSum / c.count).toFixed(2),
      avgScore: (c.scoreSum / c.count).toFixed(1)
    };
  });

  courseList.sort((a, b) => {
    if (b.count !== a.count) return b.count - a.count;
    return a.avgRank - b.avgRank;
  });

  courseList.forEach((item, index) => {
    item.rankPosition = index + 1;
  });

  return {
    totalRaceCount,
    uniqueCourses: courseList.length,
    overallAvgRank: totalRaceCount > 0 ? (totalRankSum / totalRaceCount).toFixed(2) : '-',
    overallAvgScore: totalRaceCount > 0 ? (totalScoreSum / totalRaceCount).toFixed(1) : '-',
    courseList
  };
}

// ==========================================
// 5. UI 描画
// ==========================================
function renderStats() {
  const matchMode = document.querySelector('input[name="match-mode"]:checked').value;
  const selectedCourse = document.getElementById('filter-course').value;

  const filters = {
    matchMode,
    game: document.getElementById('filter-game').value,
    mode: document.getElementById('filter-mode').value,
    season: document.getElementById('filter-season').value,
    startDate: document.getElementById('filter-start-date').value,
    endDate: document.getElementById('filter-end-date').value,
    selectedCourse
  };

  const result = computeDetailedCourseStats(activeRecordsCache, filters);

  // サマリー表示の更新
  document.getElementById('stat-total-races').textContent = result.totalRaceCount.toLocaleString();
  document.getElementById('stat-unique-courses').textContent = result.uniqueCourses;
  document.getElementById('stat-avg-rank').textContent = result.overallAvgRank;
  document.getElementById('stat-avg-score').textContent = result.overallAvgScore;

  // テーブルの更新
  const tbody = document.getElementById('course-stats-tbody');
  tbody.innerHTML = '';

  if (result.courseList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">該当するデータが存在しません</td></tr>';
    return;
  }

  result.courseList.forEach(c => {
    let rankBadge = c.rankPosition;
    if (c.rankPosition === 1) rankBadge = `<span class="rank-badge rank-1">1</span>`;
    else if (c.rankPosition === 2) rankBadge = `<span class="rank-badge rank-2">2</span>`;
    else if (c.rankPosition === 3) rankBadge = `<span class="rank-badge rank-3">3</span>`;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${rankBadge}</td>
      <td><strong>${c.name}</strong></td>
      <td>${c.count} 回</td>
      <td>${c.pickRate} %</td>
      <td>${c.raceInterval}</td>
      <td>${c.avgRank} 位</td>
      <td>${c.avgScore} 点</td>
    `;
    tbody.appendChild(tr);
  });
}
