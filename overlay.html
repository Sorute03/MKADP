<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MK Overlay Only</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: sans-serif;
    color: white;
  }

  /* 表示ボックス */
  #overlayBox {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.55);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 20px;
    line-height: 1.5;
    white-space: nowrap;
  }
  
  /* コース名とメタ情報のヘッダー行 */
  .overlay-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 4px;
  }

  /* Season / Tier 表示用バッジ */
  #overlayMetaBadge {
    font-size: 13px;
    background: rgba(255, 255, 255, 0.2);
    color: #f3f4f6;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: normal;
  }
  
  /* ★ OBS設定パネル（OBS画面でのインタラクト時のみ使用） */
  #configBox {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.85);
    padding: 15px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 999;
  }

  #configBox input {
    margin: 4px 0;
    padding: 6px;
    width: 180px;
    display: block;
    border: 1px solid #666;
    border-radius: 4px;
    background: #222;
    color: #fff;
  }

  #configBox button {
    margin-top: 8px;
    padding: 6px 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  #statusText {
    margin-top: 6px;
    font-size: 12px;
    color: #f87171;
  }
</style>

<!-- ★ PeerJS ライブラリ -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<!-- ★ OBS WebSocket ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.3/dist/obs-ws.min.js"></script>
</head>
<body>

<!-- OBS接続設定フォーム -->
<div id="configBox">
  <b>OBS WebSocket 接続設定</b>
  <input type="text" id="obsHost" placeholder="localhost" value="localhost">
  <input type="text" id="obsPort" placeholder="4455" value="4455">
  <input type="password" id="obsPassword" placeholder="OBSパスワード">
  <button onclick="initOBS()">接続して非表示</button>
  <div id="statusText"></div>
</div>

<div id="overlayBox">
  <div class="overlay-header">
    <b id="overlayCourseName">待機中...</b>
    <span id="overlayMetaBadge">Season -- / Tier --</span>
  </div>
  <div id="overlayStatsLine1">平均順位：- / 平均得点：- / 試行回数：0回</div>
  <div id="overlayStatsLine2">上位率：- / 中位率：- / 下位率：-</div>
</div>

<script>
// ==========================================
// 多言語化辞書 (i18n)
// ==========================================
const overlayI18n = {
  ja: {
    waiting: "待機中...",
    unknownCourse: "コース不明",
    avgRank: "平均順位",
    avgScore: "平均得点",
    count: "試行回数",
    times: "回",
    topRate: "上位率",
    midRate: "中位率",
    bottomRate: "下位率",
    season: "Season",
    tier: "Tier"
  },
  en: {
    waiting: "Waiting...",
    unknownCourse: "Unknown Course",
    avgRank: "Avg Rank",
    avgScore: "Avg Score",
    count: "Count",
    times: "",
    topRate: "Top Rate",
    midRate: "Mid Rate",
    bottomRate: "Bottom Rate",
    season: "Season",
    tier: "Tier"
  }
};

// ======================================================
// 1. PeerJS 連携処理
// ======================================================
const params = new URLSearchParams(location.search);
const USER = params.get("user");

console.log("[overlay] USER =", USER);

if (USER) {
  console.log("[overlay] PeerJS を初期化します…");
  const peer = new Peer("overlay-" + USER);

  peer.on("open", id => {
    console.log("[overlay] PeerID open:", id);
  });

  peer.on("error", err => {
    console.error("[overlay] PeerJS error:", err);
  });

  peer.on("disconnected", () => {
    console.warn("[overlay] PeerJS disconnected");
  });

  peer.on("close", () => {
    console.warn("[overlay] PeerJS connection closed");
  });

  peer.on("connection", conn => {
    console.log("[overlay] ADP と接続:", conn.peer);

    conn.on("open", () => {
      console.log("[overlay] conn.open: 接続成功");
    });

    conn.on("data", payload => {
      console.log("[overlay] PeerJS 受信 payload:", payload);
      renderOverlay(payload);
    });

    conn.on("error", err => {
      console.error("[overlay] conn error:", err);
    });

    conn.on("close", () => {
      console.warn("[overlay] conn closed");
    });
  });
} else {
  console.log("[overlay] ?user パラメータなし。PeerJS 連携はスキップします");
}

// ======================================================
// 2. OBS WebSocket 連携処理
// ======================================================
const obs = new OBSWebSocket();

function saveSettings() {
  localStorage.setItem("obsHost_overlay", document.getElementById("obsHost").value);
  localStorage.setItem("obsPort_overlay", document.getElementById("obsPort").value);
  localStorage.setItem("obsPassword_overlay", document.getElementById("obsPassword").value);
}

function loadSettings() {
  const host = localStorage.getItem("obsHost_overlay") || "localhost";
  const port = localStorage.getItem("obsPort_overlay") || "4455";
  const pass = localStorage.getItem("obsPassword_overlay") || "";

  document.getElementById("obsHost").value = host;
  document.getElementById("obsPort").value = port;
  document.getElementById("obsPassword").value = pass;
}

async function initOBS() {
  const host = document.getElementById("obsHost").value.trim() || "localhost";
  const port = document.getElementById("obsPort").value.trim() || "4455";
  const password = document.getElementById("obsPassword").value;
  const statusText = document.getElementById("statusText");

  saveSettings();

  try {
    console.log("[overlay] OBS WebSocket 接続試行...");
    statusText.style.color = "#facc15";
    statusText.textContent = "接続中...";

    obs.removeAllListeners("CustomEvent");
    obs.on("CustomEvent", (data) => {
      console.log("[overlay] OBS イベント受信:", data);
      
      const eventData = data.eventData || data;
      if (eventData && eventData.type === "MKADP_OVERLAY_UPDATE") {
        renderOverlay(eventData.payload);
      }
    });

    await obs.connect(`ws://${host}:${port}`, password);

    console.log("[overlay] OBS WebSocket 接続成功");
    document.getElementById("configBox").style.display = "none";

  } catch (e) {
    console.error("[overlay] OBS WebSocket 接続失敗:", e);
    statusText.style.color = "#f87171";
    statusText.textContent = "接続失敗: パスワードを確認してください";
  }
}

// ======================================================
// 3. 共通 描画処理（多言語＆メタ情報バッジ対応）
// ======================================================
function renderOverlay(payload) {
  console.log("[overlay] renderOverlay 呼び出し:", payload);

  const courseNameEl = document.getElementById("overlayCourseName");
  const metaBadgeEl = document.getElementById("overlayMetaBadge");
  const line1El = document.getElementById("overlayStatsLine1");
  const line2El = document.getElementById("overlayStatsLine2");

  if (!payload) {
    courseNameEl.textContent = "待機中...";
    metaBadgeEl.textContent = "Season -- / Tier --";
    line1El.textContent = "";
    line2El.textContent = "";
    return;
  }

  // メタ情報（言語、シーズン、Tier）の取得
  const meta = payload.meta || { language: "ja", season: "ALL", tier: "ALL" };
  const lang = overlayI18n[meta.language] ? meta.language : "ja";
  const t = overlayI18n[lang];

  // コース名とスタッツ
  const course = payload.nextCourse || t.unknownCourse;
  const s = payload.nextCourseStats || {};

  const fmt = (v) => (typeof v === "number" ? v.toFixed(1) : v);
  const percent = (v) => (typeof v === "number" ? (v * 100).toFixed(1) + "%" : v);

  // 1. ヘルパー（コース名 ＋ メタ情報バッジ）の更新
  courseNameEl.textContent = course;
  metaBadgeEl.textContent = `${t.season} ${meta.season} / ${t.tier} ${meta.tier}`;

  // 2. 統計数値の更新（多言語対応）
  line1El.innerHTML = `${t.avgRank}：${fmt(s.avgRank)}位 / ${t.avgScore}：${fmt(s.avgScore)}点 / ${t.count}：${s.count ?? 0}${t.times}`;
  line2El.innerHTML = `${t.topRate}：${percent(s.topRate)} / ${t.midRate}：${percent(s.midRate)} / ${t.bottomRate}：${percent(s.bottomRate)}`;
}

// 初期化
window.addEventListener("DOMContentLoaded", () => {
  loadSettings();
  initOBS(); // OBS接続を自動試行
});
</script>
</body>
</html>
