<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MK Overlay Only</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: sans-serif;
    color: white;
  }

  #overlayBox {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.55);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 24px;
    line-height: 1.6;
    min-width: 300px;
  }
</style>
</head>
<body>

<div id="overlayBox">待機中...</div>

<script>
// ======================================================
// ★ URL パラメータから user を取得
// ======================================================
const params = new URLSearchParams(location.search);
const USER = params.get("user");

if (!USER) {
  console.error("overlay: ?user=◯◯ が指定されていません");
}

// ======================================================
// ★ overlay.json を fetch → ユーザーのデータを抽出
// ======================================================
async function fetchOverlayJson() {
  try {
    const res = await fetch("https://sorute03.github.io/MKADP/overlay.json?v=" + Date.now());
    const json = await res.json();

    console.log("=== overlay JSON check ===");
    console.log("USER:", USER);
    console.log("json:", json);
    console.log("json[USER]:", json[USER]);
    console.log("==========================");

    return json[USER] || null;

  } catch (e) {
    console.error("overlay.json 取得失敗", e);
    return null;
  }
}

// ======================================================
// ★ overlay 描画
// ======================================================
function renderOverlay(payload) {
  if (!payload) return;

  const box = document.getElementById("overlayBox");

  const course = payload.nextCourse || "コース不明";
  const s = payload.nextCourseStats || {};

  const fmt = (v) => (typeof v === "number" ? v.toFixed(1) : v);
  const percent = (v) => (typeof v === "number" ? (v * 100).toFixed(1) + "%" : v);

  box.innerHTML = `
    <div><b>${course}</b></div>
    <div>平均順位：${fmt(s.avgRank)}位</div>
    <div>平均得点：${fmt(s.avgScore)}点</div>
    <div>試行回数：${s.count}回</div>
    <div>上位率：${percent(s.topRate)}</div>
    <div>中位率：${percent(s.midRate)}</div>
    <div>下位率：${percent(s.bottomRate)}</div>
  `;
}

// ======================================================
// ★ 1秒ごとに overlay.json を取得して描画
// ======================================================
setInterval(async () => {
  const payload = await fetchOverlayJson();
  console.log("overlay payload:", payload);
  if (payload) renderOverlay(payload);
}, 1000);

</script>

</body>
</html>
