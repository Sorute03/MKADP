<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MK Overlay Only</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: sans-serif;
    color: white;
  }

  #overlayBox {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.55);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 24px;
    line-height: 1.6;
    min-width: 300px;
  }
</style>
</head>
<body>

<div id="overlayBox">待機中...</div>

<!-- ★ PeerJS を読み込む -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
// ======================================================
// ★ URL パラメータから user を取得
// ======================================================
const params = new URLSearchParams(location.search);
const USER = params.get("user");

console.log("[overlay] USER =", USER);

if (!USER) {
  console.error("[overlay] ?user=◯◯ が指定されていません");
}

// ======================================================
// ★ PeerJS 初期化（ログ強化版）
// ======================================================
console.log("[overlay] PeerJS を初期化します…");

const peer = new Peer("overlay-" + USER);

peer.on("open", id => {
  console.log("[overlay] PeerID open:", id);
});

peer.on("error", err => {
  console.error("[overlay] PeerJS error:", err);
});

peer.on("disconnected", () => {
  console.warn("[overlay] PeerJS disconnected");
});

peer.on("close", () => {
  console.warn("[overlay] PeerJS connection closed");
});

// ======================================================
// ★ ADP からの接続を受け取る（ログ強化版）
// ======================================================
peer.on("connection", conn => {
  console.log("[overlay] ADP と接続:", conn.peer);

  conn.on("open", () => {
    console.log("[overlay] conn.open: 接続成功");
  });

  conn.on("data", payload => {
    console.log("[overlay] 受信 payload:", payload);
    renderOverlay(payload);
  });

  conn.on("error", err => {
    console.error("[overlay] conn error:", err);
  });

  conn.on("close", () => {
    console.warn("[overlay] conn closed");
  });
});

// ======================================================
// ★ overlay 描画（既存のまま）
// ======================================================
function renderOverlay(payload) {
  console.log("[overlay] renderOverlay 呼び出し:", payload);

  const box = document.getElementById("overlayBox");

  if (!payload) {
    box.innerHTML = "待機中...";
    return;
  }

  const course = payload.nextCourse || "コース不明";
  const s = payload.nextCourseStats || {};

  const fmt = (v) => (typeof v === "number" ? v.toFixed(1) : v);
  const percent = (v) => (typeof v === "number" ? (v * 100).toFixed(1) + "%" : v);

  box.innerHTML = `
    <div><b>${course}</b></div>
    <div>平均順位：${fmt(s.avgRank)}位</div>
    <div>平均得点：${fmt(s.avgScore)}点</div>
    <div>試行回数：${s.count ?? 0}回</div>
    <div>上位率：${percent(s.topRate)}</div>
    <div>中位率：${percent(s.midRate)}</div>
    <div>下位率：${percent(s.bottomRate)}</div>
  `;
}
</script>
</body>
</html>
