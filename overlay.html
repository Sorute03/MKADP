<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MK Overlay Only</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: sans-serif;
    color: white;
  }

  /* 表示ボックス */
  #overlayBox {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.6);
    padding: 14px 18px;
    border-radius: 8px;
    font-size: 20px;
    line-height: 1.5;
    white-space: nowrap;
  }
  
  /* コース名とシーズン/Tierを同じ形式で横並びにするヘッダー行 */
  .overlay-header {
    display: flex;
    align-items: baseline;
    gap: 15px;
    margin-bottom: 6px;
  }

  #configBox {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.85);
    padding: 15px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 999;
  }

  #configBox input {
    margin: 4px 0;
    padding: 6px;
    width: 180px;
    display: block;
    border: 1px solid #666;
    border-radius: 4px;
    background: #222;
    color: #fff;
  }

  #configBox button {
    margin-top: 8px;
    padding: 6px 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  #statusText {
    margin-top: 6px;
    font-size: 12px;
    color: #f87171;
  }
</style>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.3/dist/obs-ws.min.js"></script>
</head>
<body>

<div id="configBox">
  <b>OBS WebSocket 接続設定</b>
  <input type="text" id="obsHost" placeholder="localhost" value="localhost">
  <input type="text" id="obsPort" placeholder="4455" value="4455">
  <input type="password" id="obsPassword" placeholder="OBSパスワード">
  <button onclick="initOBS()">接続して非表示</button>
  <div id="statusText"></div>
</div>

<div id="overlayBox">
  <div class="overlay-header">
    <b id="overlayCourseName" style="font-size: 22px;">待機中...</b>
    <span id="overlayMetaText" style="font-size: 18px; color: #d1d5db; font-weight: normal;">Season -- / Tier --</span>
  </div>
  <div id="overlayStatsLine1">平均順位：- / 平均得点：- / 試行回数：0回</div>
  <div id="overlayStatsLine2">上位率：- / 中位率：- / 下位率：-</div>
</div>

<script>
// コース名英語変換用辞書
const MKWORLD_COURSE_I18N = {
  "マリオブラザーズサーキット": "Mario Bros. Circuit",
  "トロフィーシティ": "Crown City",
  "シュポポコースター": "Whistlestop Summit",
  "DKうちゅうセンター": "DK Spaceport",
  "サンサンさばく": "Desert Hills",
  "ヘイホーカーニバル": "Shy Guy Bazaar",
  "ワリオスタジアム": "Wario Stadium",
  "キラーシップ": "Airship Fortress",
  "DKスノーマウンテン": "DK Pass",
  "ロゼッタてんもんだい": "Starview Peak",
  "アイスビルディング": "Sky-High Sundae",
  "バニラレイク": "SNES Vanilla Lake 1",
  "ワリオシップ": "Wario Shipyard",
  "ノコノコビーチ": "Koopa Troopa Beach",
  "SFCノコノコビーチ": "SNES Koopa Beach 1",
  "リバーサイドサファリ": "Faraway Oasis",
  "ピーチスタジアム": "Peach Stadium",
  "ピーチビーチ": "Peach Beach",
  "ソルティータウン": "Salty Salty Speedway",
  "ディノディノジャングル": "Dino Dino Jungle",
  "ハテナしんでん": "Great ? Block Ruins",
  "プクプクフォールズ": "Cheep Cheep Falls",
  "ショーニューロード": "Dandelion Depths",
  "おばけシネマ": "Boo Cinema",
  "おばけぬま1": "SNES Ghost Valley 1",
  "おばけぬま2": "SNES Ghost Valley 2",
  "おばけぬま3": "SNES Ghost Valley 3",
  "ホネホネツイスター": "Dry Bones Burnout",
  "モーモーカントリー": "Moo Moo Meadows",
  "チョコマウンテン": "Choco Mountain",
  "チョコレーとう1": "SNES Choco Island 1",
  "チョコレーとう2": "SNES Choco Island 2",
  "キノピオファクトリー": "Toad's Factory",
  "クッパキャッスル": "Bowser's Castle",
  "どんぐりツリーハウス": "Acorn Heights",
  "マリオサーキット": "Mario Circuit",
  "SFCマリオサーキット1": "SNES Mario Circuit 1",
  "SFCマリオサーキット2": "SNES Mario Circuit 2",
  "SFCマリオサーキット3": "SNES Mario Circuit 3",
  "レインボーロード": "Rainbow Road"
};

// コース単体の翻訳ヘルパー（遷移コース "→" にも対応）
function translateCourseForOverlay(courseName, lang) {
  if (!courseName) return '';
  if (lang !== 'en') return courseName;

  if (courseName.includes('→') || courseName.includes('->')) {
    const sep = courseName.includes('→') ? '→' : '->';
    return courseName.split(sep).map(p => MKWORLD_COURSE_I18N[p.trim()] || p.trim()).join(' → ');
  }
  return MKWORLD_COURSE_I18N[courseName] || courseName;
}

const overlayI18n = {
  ja: {
    waiting: "待機中...",
    unknownCourse: "コース不明",
    avgRank: "平均順位",
    avgScore: "平均得点",
    count: "試行回数",
    times: "回",
    topRate: "上位率",
    midRate: "中位率",
    bottomRate: "下位率",
    season: "Season",
    tier: "Tier"
  },
  en: {
    waiting: "Waiting...",
    unknownCourse: "Unknown Course",
    avgRank: "Avg Rank",
    avgScore: "Avg Score",
    count: "Count",
    times: "",
    topRate: "Top Rate",
    midRate: "Mid Rate",
    bottomRate: "Bottom Rate",
    season: "Season",
    tier: "Tier"
  }
};

const params = new URLSearchParams(location.search);
const USER = params.get("user");

if (USER) {
  const peer = new Peer("overlay-" + USER);
  peer.on("connection", conn => {
    conn.on("data", payload => {
      renderOverlay(payload);
    });
  });
}

const obs = new OBSWebSocket();

function saveSettings() {
  localStorage.setItem("obsHost_overlay", document.getElementById("obsHost").value);
  localStorage.setItem("obsPort_overlay", document.getElementById("obsPort").value);
  localStorage.setItem("obsPassword_overlay", document.getElementById("obsPassword").value);
}

function loadSettings() {
  document.getElementById("obsHost").value = localStorage.getItem("obsHost_overlay") || "localhost";
  document.getElementById("obsPort").value = localStorage.getItem("obsPort_overlay") || "4455";
  document.getElementById("obsPassword").value = localStorage.getItem("obsPassword_overlay") || "";
}

async function initOBS() {
  const host = document.getElementById("obsHost").value.trim() || "localhost";
  const port = document.getElementById("obsPort").value.trim() || "4455";
  const password = document.getElementById("obsPassword").value;
  const statusText = document.getElementById("statusText");

  saveSettings();

  try {
    statusText.style.color = "#facc15";
    statusText.textContent = "接続中...";

    obs.removeAllListeners("CustomEvent");
    obs.on("CustomEvent", (data) => {
      const eventData = data.eventData || data;
      if (eventData && eventData.type === "MKADP_OVERLAY_UPDATE") {
        renderOverlay(eventData.payload);
      }
    });

    await obs.connect(`ws://${host}:${port}`, password);
    document.getElementById("configBox").style.display = "none";
  } catch (e) {
    statusText.style.color = "#f87171";
    statusText.textContent = "接続失敗";
  }
}

function renderOverlay(payload) {
  const courseNameEl = document.getElementById("overlayCourseName");
  const metaTextEl = document.getElementById("overlayMetaText");
  const line1El = document.getElementById("overlayStatsLine1");
  const line2El = document.getElementById("overlayStatsLine2");

  if (!payload) {
    courseNameEl.textContent = "待機中...";
    metaTextEl.textContent = "Season -- / Tier --";
    line1El.textContent = "";
    line2El.textContent = "";
    return;
  }

  const meta = payload.meta || { language: "ja", season: "ALL", tier: "ALL" };
  const langKey = (meta.language && meta.language.toLowerCase().includes("en")) ? "en" : "ja";
  const t = overlayI18n[langKey];

  // コース名の翻訳処理を適用
  const rawCourse = payload.nextCourse || t.unknownCourse;
  const displayCourse = translateCourseForOverlay(rawCourse, langKey);

  const s = payload.nextCourseStats || {};

  const fmt = (v) => (typeof v === "number" ? v.toFixed(1) : v);
  const percent = (v) => (typeof v === "number" ? (v * 100).toFixed(1) + "%" : v);

  // 表示更新
  courseNameEl.textContent = displayCourse;
  metaTextEl.textContent = `${t.season} ${meta.season} / ${t.tier} ${meta.tier}`;

  line1El.innerHTML = `${t.avgRank}：${fmt(s.avgRank)} / ${t.avgScore}：${fmt(s.avgScore)} / ${t.count}：${s.count ?? 0}${t.times}`;
  line2El.innerHTML = `${t.topRate}：${percent(s.topRate)} / ${t.midRate}：${percent(s.midRate)} / ${t.bottomRate}：${percent(s.bottomRate)}`;
}

window.addEventListener("DOMContentLoaded", () => {
  loadSettings();
  initOBS();
});
</script>
</body>
</html>
