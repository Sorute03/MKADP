<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MK Overlay (Local)</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: sans-serif;
    color: white;
  }

  #overlayBox {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.55);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 24px;
    line-height: 1.6;
    min-width: 300px;
  }

  #pwBox {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.4);
    padding: 6px;
    border-radius: 6px;
  }

  #pwInput {
    font-size: 20px;
    padding: 4px;
  }
</style>
</head>
<body>

<div id="pwBox">
  <input id="pwInput" placeholder="Password">
  <button id="savePwBtn">保存</button>
</div>

<div id="overlayBox">待機中...</div>

<script>
// ★ パスワード保存
document.getElementById("savePwBtn").onclick = () => {
  const pw = document.getElementById("pwInput").value.trim();
  if (!pw) return alert("パスワードを入力してください");
  localStorage.setItem("overlayPassword", pw);
  alert("保存しました");
};

// ★ 起動時にパスワード読み込み
(function loadPw() {
  const pw = localStorage.getItem("overlayPassword");
  if (pw) document.getElementById("pwInput").value = pw;
})();

// ★ BroadcastChannel 受信
const channel = new BroadcastChannel("mk_overlay_channel");

channel.onmessage = (e) => {
  const { password, payload } = e.data;

  const localPw = localStorage.getItem("overlayPassword");

  if (password !== localPw) {
    console.log("パスワード不一致");
    return;
  }

  renderOverlay(payload);
};

// ★ overlay 描画
function renderOverlay(payload) {
  if (!payload) return;

  const box = document.getElementById("overlayBox");

  const course = payload.nextCourse || "コース不明";
  const s = payload.nextCourseStats || {};

  const fmt = (v) => (typeof v === "number" ? v.toFixed(1) : v);
  const percent = (v) => (typeof v === "number" ? (v * 100).toFixed(1) + "%" : v);

  box.innerHTML = `
    <div><b>${course}</b></div>
    <div>平均順位：${fmt(s.avgRank)}位</div>
    <div>平均得点：${fmt(s.avgScore)}点</div>
    <div>試行回数：${s.count}回</div>
    <div>上位率：${percent(s.topRate)}</div>
    <div>中位率：${percent(s.midRate)}</div>
    <div>下位率：${percent(s.bottomRate)}</div>
  `;
}
</script>

</body>
</html>
