<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  display: flex;
  justify-content: flex-end;
  align-items: flex-end;
  height: 100vh;
}

#overlay {
  background-color: rgba(0,0,0,0.5);
  color: white;
  padding: 8px;
  font-size: 24px;
  border-radius: 6px;
  font-family: sans-serif;
  line-height: 1.6;
  word-wrap: break-word;
}

#pwBox {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.4);
  padding: 6px;
  border-radius: 6px;
}
#pw {
  font-size: 20px;
  padding: 4px;
}
</style>
</head>
<body>

<div id="pwBox">
  <input id="pw" placeholder="Password">
</div>

<div id="overlay">読み込み中...</div>

<script>
// ★ 最新の Web アプリ URL（GAS の doGet/doPost と一致させる）
const baseUrl = "https://script.google.com/macros/s/AKfycbxgfB9ENdqrMt_kLzmOera70f_wKWo3Yv5kVmwrlB7f6IUphMFLfoTLKGqNoozF67BB/exec";

// ▼ 現在のコース名を取得（mode=key）
function fetchCurrentKey(pw) {
  return fetch(baseUrl + "?password=" + encodeURIComponent(pw) + "&mode=key&t=" + Date.now())
    .then(res => res.json())
    .then(data => {
      if (data.error) {
        console.error("パスワードエラー");
        return "";
      }
      return data.key;
    })
    .catch(err => {
      console.error("key取得エラー:", err);
      return "";
    });
}

// ▼ コース名を使ってオーバーレイ内容を取得
function fetchOverlay(pw, key) {
  return fetch(baseUrl + "?password=" + encodeURIComponent(pw) + "&key=" + encodeURIComponent(key) + "&t=" + Date.now())
    .then(res => res.json())
    .catch(err => {
      console.error("overlay取得エラー:", err);
      return { html: "エラー: " + err };
    });
}

// ▼ オーバーレイ更新処理
function updateOverlay() {
  const pw = document.getElementById("pw").value.trim();
  if (!pw) return;

  fetchCurrentKey(pw)
    .then(key => {
      if (!key) return;
      return fetchOverlay(pw, key);
    })
    .then(data => {
      if (data && data.html) {
        document.getElementById("overlay").innerHTML = data.html;
      }
    });
}

// ▼ 初回ロード & 5秒ごと更新
window.onload = function() {
  updateOverlay();
  setInterval(updateOverlay, 5000);
};
</script>

</body>
</html>
