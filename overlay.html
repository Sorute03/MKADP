<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MK Overlay Only</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: sans-serif;
    color: white;
  }

  #overlayBox {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.55);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 24px;
    line-height: 1.6;
    min-width: 300px;
  }
</style>
</head>
<body>

<div id="overlayBox">待機中...</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
// ======================================================
// ★ URL パラメータから user を取得
// ======================================================
const params = new URLSearchParams(location.search);
const USER = params.get("user");

if (!USER) {
  console.error("overlay: ?user=◯◯ が指定されていません");
}

// ======================================================
// ★ PeerJS で ADP からのデータを受信
// ======================================================
const peer = new Peer("overlay-" + USER);

peer.on("open", () => {
  console.log("overlay PeerID:", "overlay-" + USER);
});

peer.on("connection", conn => {
  console.log("ADP と接続:", conn.peer);

  conn.on("data", payload => {
    console.log("受信 payload:", payload);
    renderOverlay(payload);
  });
});

// ======================================================
// ★ overlay 描画（既存のまま）
// ======================================================
function renderOverlay(payload) {
  const box = document.getElementById("overlayBox");

  if (!payload) {
    box.innerHTML = "待機中...";
    return;
  }

  const course = payload.nextCourse || "コース不明";
  const s = payload.nextCourseStats || {};

  const fmt = (v) => (typeof v === "number" ? v.toFixed(1) : v);
  const percent = (v) => (typeof v === "number" ? (v * 100).toFixed(1) + "%" : v);

  box.innerHTML = `
    <div><b>${course}</b></div>
    <div>平均順位：${fmt(s.avgRank)}位</div>
    <div>平均得点：${fmt(s.avgScore)}点</div>
    <div>試行回数：${s.count ?? 0}回</div>
    <div>上位率：${percent(s.topRate)}</div>
    <div>中位率：${percent(s.midRate)}</div>
    <div>下位率：${percent(s.bottomRate)}</div>
  `;
}
</script>

</body>
</html>
