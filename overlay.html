<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MK Overlay Only</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: sans-serif;
    color: white;
  }

  #overlayBox {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.55);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 24px;
    line-height: 1.6;
    min-width: 300px;
  }
</style>
</head>
<body>

<div id="overlayBox">待機中...</div>

<script>
// ======================================================
// ★ URL パラメータから user を取得（登録式 multi-user のキー）
// ======================================================
const params = new URLSearchParams(location.search);
const USER = params.get("user");

if (!USER) {
  console.error("overlay: ?user=◯◯ が指定されていません");
}

// ======================================================
// ★ ADP.html を fetch → mkadp-data-USER を抽出
// ======================================================
async function fetchAdpData() {
  try {
    const html = await fetch("https://sorute03.github.io/MKADP/MKADP.html?=v2").then(r => r.text());
    const doc = new DOMParser().parseFromString(html, "text/html");

    // ★ 登録式なので mkadp-data-USER を読む
    const tag = doc.getElementById(`mkadp-data-${USER}`);

    console.log("=== overlay JSON check ===");
    console.log("USER:", USER);
    console.log("tag:", tag);
    console.log("tag?.textContent:", tag?.textContent);

    if (!tag) {
      console.warn(`mkadp-data-${USER} が ADP.html に存在しません`);
      return null;
    }

    const json = JSON.parse(tag.textContent);
    console.log("parsed JSON:", json);
    console.log("==========================");

    return json;

  } catch (e) {
    console.error("ADP データ取得失敗", e);
    return null;
  }
}

// ======================================================
// ★ overlay 描画（あなたの現行コード）
// ======================================================
function renderOverlay(payload) {
  if (!payload) return;

  const box = document.getElementById("overlayBox");

  const course = payload.nextCourse || "コース不明";
  const s = payload.nextCourseStats || {};

  const fmt = (v) => (typeof v === "number" ? v.toFixed(1) : v);
  const percent = (v) => (typeof v === "number" ? (v * 100).toFixed(1) + "%" : v);

  box.innerHTML = `
    <div><b>${course}</b></div>
    <div>平均順位：${fmt(s.avgRank)}位</div>
    <div>平均得点：${fmt(s.avgScore)}点</div>
    <div>試行回数：${s.count}回</div>
    <div>上位率：${percent(s.topRate)}</div>
    <div>中位率：${percent(s.midRate)}</div>
    <div>下位率：${percent(s.bottomRate)}</div>
  `;
}

// ======================================================
// ★ 1秒ごとに ADP の最新データを取得して描画
// ======================================================
setInterval(async () => {
  const payload = await fetchAdpData();
  console.log("overlay payload:", payload);
  if (payload) renderOverlay(payload);
}, 1000);

</script>

</body>
</html>
