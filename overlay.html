// ▼ IndexedDB を開く
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("MKADP_DB", 1);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// ▼ 全レコード取得
async function getAllRecords() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("records", "readonly");
    const store = tx.objectStore("records");
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// ▼ URL パラメータを取得
const params = new URLSearchParams(location.search);

// ▼ UI 初期値（URL → localStorage → デフォルト の優先順位）
function loadUI() {
  modeSel.value   = params.get("mode")   || localStorage.getItem("overlay_mode")   || "ALL";
  seasonSel.value = params.get("season") || localStorage.getItem("overlay_season") || "ALL";
  courseSel.value = params.get("course") || localStorage.getItem("overlay_course") || "ALL";
}
loadUI();

// ▼ UI 変更時に localStorage に保存
function saveUI() {
  localStorage.setItem("overlay_mode", modeSel.value);
  localStorage.setItem("overlay_season", seasonSel.value);
  localStorage.setItem("overlay_course", courseSel.value);
}
modeSel.onchange = saveUI;
seasonSel.onchange = saveUI;
courseSel.onchange = saveUI;

// ▼ 統計計算
function calcStats(records) {
  if (!records.length) return null;

  const count = records.length;
  const wins = records.filter(r => r.rank <= 3).length;
  const sumRank = records.reduce((s, r) => s + r.rank, 0);
  const sumScore = records.reduce((s, r) => s + r.score, 0);

  const avgRank = sumRank / count;
  const avgScore = sumScore / count;

  const topRate    = records.filter(r => r.rank <= 5).length / count;
  const midRate    = records.filter(r => r.rank >= 6 && r.rank <= 15).length / count;
  const bottomRate = records.filter(r => r.rank >= 16).length / count;

  return {
    count,
    avgRank,
    avgScore,
    winRate: wins / count,
    topRate,
    midRate,
    bottomRate
  };
}

// ▼ HTML 生成
function buildHTML(course, stats) {
  if (!stats) return `<b>${course}</b><br>データなし`;

  return `
    <b>${course}</b><br>
    平均順位 ${stats.avgRank.toFixed(2)}位 ｜ 
    平均得点 ${stats.avgScore.toFixed(2)}点 ｜ 
    試行回数 ${stats.count}回<br>
    勝率 ${(stats.winRate * 100).toFixed(1)}% ｜ 
    上位率 ${(stats.topRate * 100).toFixed(1)}% ｜ 
    中位率 ${(stats.midRate * 100).toFixed(1)}% ｜ 
    下位率 ${(stats.bottomRate * 100).toFixed(1)}%
  `;
}

// ▼ フィルタ処理
function filterRecords(records) {
  let r = [...records];

  // コース名揺れ補正
  r = r.map(rec => {
    if (courseList.includes(rec.course)) return rec;
    const base = rec.course.split("→")[0];
    const match = courseList.find(c => c === base);
    return match ? { ...rec, course: match } : rec;
  });

  const mode   = modeSel.value;
  const season = seasonSel.value;
  const course = courseSel.value;

  if (mode !== "ALL")   r = r.filter(x => x.mode === mode);
  if (season !== "ALL") r = r.filter(x => x.season === season);
  if (course !== "ALL") r = r.filter(x => x.course === course);

  return r;
}

// ▼ overlay 更新
async function updateOverlay() {
  const all = await getAllRecords();
  const records = filterRecords(all);

  if (!records.length) {
    overlayBox.innerHTML = "データなし";
    return;
  }

  // NEXT_COURSE（index.html が保存した値）
  const nextCourse = localStorage.getItem("nextCourse") || "";

  if (nextCourse) {
    const filtered = records.filter(r => r.course === nextCourse);
    const stats = calcStats(filtered);
    overlayBox.innerHTML = buildHTML(nextCourse, stats);
    return;
  }

  // 最新コース
  const last = records[records.length - 1];
  const course = last.course;

  const stats = calcStats(records.filter(r => r.course === course));
  overlayBox.innerHTML = buildHTML(course, stats);
}

// ▼ 初回 + 2秒ごと更新
updateOverlay();
setInterval(updateOverlay, 2000);
