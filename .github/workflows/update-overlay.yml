name: Update Overlay JSON

on:
  workflow_dispatch:
    inputs:
      user:
        description: "User name"
        required: true
      payload:
        description: "JSON payload"
        required: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare overlay.json
        run: |
          FILE="overlay.json"

          # 既存ファイルが無ければ初期化
          if [ ! -f "$FILE" ]; then
            echo "{}" > "$FILE"
          fi

          # 現在の JSON を読み込み
          CONTENT=$(cat "$FILE")

          # jq でユーザーのデータを更新
          echo "$CONTENT" | \
            jq --arg user "${{ github.event.inputs.user }}" \
               --argjson payload "${{ github.event.inputs.payload }}" \
               '.[$user] = $payload' > overlay.json

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update overlay.json"
          file_pattern: overlay.json
        env:
          GITHUB_TOKEN: ${{ secrets.MKADP_TOKEN }}
