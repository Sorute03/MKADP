name: Generate Sitemap

on:
  push:
    branches:
      - main  # または master（デフォルトブランチ名に合わせて変更してください）
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜日の0:00(UTC)に自動更新

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate Sitemap
    steps:
    - name: Checkout the repo
      uses: actions/checkout@v4

    - name: Generate Sitemap
      uses: cicirello/generate-sitemap@v1
      with:
        baseUrl: 'https://sorute03.github.io/MKADP/'
        include-pdf: false

    - name: Commit and Push Sitemap
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sitemap.xml
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated sitemap update" && git push)
