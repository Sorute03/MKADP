<!DOCTYPE html>
<html>
<body style="background:transparent;color:white;font-size:24px;">
<div id="display">読み込み中...</div>

<script>
async function loadData() {
  const res = await fetch("https://sorute03.github.io/MKADP/data.json", {
    cache: "no-store"
  });
  const data = await res.json();
  document.getElementById("display").innerText = data.value;
}

loadData();
setInterval(loadData, 5000);
</script>
</body>
</html>
